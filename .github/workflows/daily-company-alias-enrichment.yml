name: Daily Company Alias Enrichment

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: Number of eligible companies to research
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "2"
          - "5"
          - "10"

  schedule:
    # 06:00 every day in Korea, separately from holdings collection.
    - cron: "0 6 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: daily-company-alias-enrichment
  cancel-in-progress: false

jobs:
  enrich-company-aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate deterministic aliases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.generate_deterministic_aliases --save

      - name: Research additional aliases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ALIAS_MODEL: gpt-5-mini
          ALIAS_RESEARCH_REFRESH_DAYS: "180"
          BATCH_LIMIT: ${{ inputs.batch_limit || '5' }}
        run: >-
          python -m scripts.enrich_company_aliases
          --limit "$BATCH_LIMIT"
          --save
